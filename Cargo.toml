[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/filter",
    "crates/monte_carlo",
    "crates/policy",
    "crates/geometry",
    "crates/data",
    "crates/evaluation",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Metis-Avionics/economic-prv"
authors = ["Metis Avionics"]

[workspace.dependencies]
nalgebra = "0.35"
ndarray = "0.17"
rand = "0.10"
rand_distr = "0.6"
statrs = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
proptest = "1"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
thesix = { version = "0.2", features = ["redis", "sled"] }
themql-core = "0.1"
themql-runtime = { version = "0.1", features = ["desktop"] }
