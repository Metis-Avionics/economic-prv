[policy]
type = "stochastic_probabilistic"
output = "PolicyDistribution"
no_single_point_policy = true

[instruments]
types = ["InterestRate", "QuantitativeEasing", "SovereignWealthFundDeployment", "FiscalSpending", "Taxation", "InfrastructureInvestment", "MigrationCapacity"]

[weights]
capacity = 1.0
investment = 1.0
employment = 1.0
inflation = 1.0
debt = 1.0
housing_pressure = 1.0
systemic_risk = 1.0

[regime_response]
Expansion = "neutral_maintenance"
Saturation = "targeted_intervention"
Contraction = "stimulus"
Recovery = "gradual_normalization"
StructuralShock = "emergency_response"

[constraints]
quantitative_easing = ["inflation_and_financial_stability"]
sovereign_wealth_fund = ["fund_liquidity_and_intergenerational_equity"]

[output_fields]
recommended_action_distribution = true
expected_state_change = true
downside_distribution = true
tail_risk = true
constraint_violations = true