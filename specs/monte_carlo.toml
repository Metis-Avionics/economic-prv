[monte_carlo]
sample_method = "multivariate_normal_cholesky"
chol_fallback = "nearest_psd_via_eigenvalue_clipping"
seed = "deterministic_std_rng_seed_from_u64"
record_seed = true
record_sample_count = true

[shocks]
types = ["Demand", "Supply", "Investment", "Geopolitical", "Fiscal", "Migration", "Housing", "Financial"]
amplitude = "per_spec"
persistence = "per_spec"
autocorrelation = "per_spec"

[results]
quantiles = [0.01, 0.05, 0.10, 0.50, 0.90, 0.95, 0.99]
metrics = ["mean", "median", "tail_risk", "regime_distribution", "probabilities"]
probabilities = ["capacity_increase", "capacity_decline", "investment_increase", "investment_decline", "regime_transition"]