# cargo-deny configuration — PRV supply-chain gate.
#
# This file is the authoritative supply-chain policy for the PRV Rust
# workspace. `cargo deny check` runs as a blocking CI gate.
#
# Advisory-exception policy:
#   Each entry in [advisories].ignore MUST include:
#     - why:              the advisory and affected crate
#     - not-exploitable:  why the vulnerability is not reachable in PRV's
#                          dependency graph
#     - path:             the full crate chain from PRV to the vulnerable crate
#     - reassess:         when to revisit (version bump, upstream fix, dep removal)

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # Format (cargo-deny v2):
    #   { id = "RUSTSEC-XXXX-NNNN", reason = "why | not-exploitable | path | reassess" },
    # RUSTSEC-2024-0384: `instant` unmaintained, reached only via sled -> parking_lot.
    # PRV's cache layer (thesix -> sled) does not take attacker-controlled
    # timing inputs; the unmaintained-status advisory has no known exploit
    # path in this workspace. Reassess when sled swaps parking_lot or
    # thesix replaces its sled backend.
    { id = "RUSTSEC-2024-0384", reason = "unmaintained advisory; reached only via thesix -> sled -> parking_lot (no attacker-controlled timing) | path: prv-cache -> thesix -> sled -> parking_lot -> instant | reassess when sled replaces parking_lot or thesix drops sled" },
    # RUSTSEC-2025-0057: `fxhash` unmaintained; sled's internal hash function.
    # No known exploit path; only used in sled's internal in-memory maps.
    # Reassess when sled / thesix switches to rustc-hash.
    { id = "RUSTSEC-2025-0057", reason = "unmaintained advisory; sled-internal hashing only, no attacker-controlled hash input | path: prv-cache -> thesix -> sled -> fxhash | reassess when sled swaps to rustc-hash" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "0BSD",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    # OpenSSL duplicates: PRV uses rustls via HTTP clients.
    # Refuse any duplicate OpenSSL bindings until one is justified.
    { name = "openssl-sys", reason = "rustls only; no OpenSSL linkage in workspace" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
