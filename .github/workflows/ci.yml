name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CI: true
  CARGO_TERM_COLOR: always

jobs:
  rust-check:
    name: Rust build + clippy + tests + supply-chain gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `stable`. The version is asserted against
      # rust-toolchain.toml by scripts/check-toolchain-pin.sh, so the two
      # cannot drift. A floating toolchain here means a stable release can
      # redden this build with no change in the repository.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - name: Toolchain pin is consistent
        run: bash scripts/check-toolchain-pin.sh

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      - name: TETANUS power-of-ten checker
        run: python3 scripts/tetanus-check.py

      - name: Schema sketch check
        run: bash scripts/check_schema.sh

      - name: Coarse lock audit (DashMap policy)
        run: bash scripts/check_no_coarse_locks.sh

      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --locked
          fi

      - name: cargo deny check
        run: cargo deny check

      - name: Install cargo-machete
        run: |
          required_version="0.9.2"
          installed_version="$(cargo machete --version 2>/dev/null || true)"
          if [[ "$installed_version" != "$required_version" ]]; then
            cargo install cargo-machete --version "$required_version" --locked --force
          fi
          test "$(cargo machete --version)" = "$required_version"

      - name: cargo machete — unused dependency gate
        run: cargo machete --skip-target-dir

      - name: Verify workspace crates on crates.io
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"//;s/".*//')
          echo "Verifying crates.io availability for version $VERSION"
          for crate in prv-core prv-cache prv-filter prv-geometry prv-monte-carlo prv-policy prv-data prv-evaluation prv-cli; do
            echo "Checking $crate $VERSION..."
            cargo search "$crate" --limit 1 | grep -q "$crate = \"$VERSION\"" || {
              echo "::error::$crate $VERSION not found on crates.io"
              exit 1
            }
          done
          echo "All 9 workspace crates verified on crates.io at version $VERSION"
